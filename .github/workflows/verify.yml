name: 质量检查

on:
  workflow_call:

jobs:
  node:
    name: web + packages（lint / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # pnpm 10 默认拦截原生模块构建脚本；主路径应被 package.json 的
      # pnpm.onlyBuiltDependencies 放行，兜底用 approve-builds 显式批准
      - name: 安装依赖
        run: pnpm install || (pnpm approve-builds --all && pnpm install)

      - name: 校验原生模块可用
        run: |
          pnpm --filter apps-web exec node -e "require('better-sqlite3'); console.log('better-sqlite3 ok')"
          pnpm --filter apps-vscode-ext exec node -e "require('esbuild'); console.log('esbuild ok')"

      - name: Lint
        run: pnpm lint

      - name: 单元测试（tsx --test + vitest）
        run: pnpm test

  desktop:
    name: desktop-rs（cargo test）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-rs

      - name: cargo test
        working-directory: apps/desktop-rs
        run: cargo test

  mobile:
    name: mobile（gradle 单元测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 确保 gradlew 可执行
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      - name: :app:testDebugUnitTest
        working-directory: apps/mobile/android
        run: ./gradlew :app:testDebugUnitTest
