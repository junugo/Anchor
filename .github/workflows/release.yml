name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 阶段 1：质量检查（与 CI 同一套 verify，全绿才进入打包）
  verify:
    uses: ./.github/workflows/verify.yml

  # 阶段 2：打包所有客户端
  package-desktop:
    name: 打包桌面端（Windows x64）
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-rs

      - name: cargo build --release
        working-directory: apps/desktop-rs
        run: cargo build --release

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      # 安装器脚本 packaging/anchor.iss；AppVersion 用 tag 版本覆盖脚本内默认
      - name: 编译安装器
        shell: pwsh
        working-directory: apps/desktop-rs
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc "packaging\anchor.iss" "/DAppVersion=$ver"
          Copy-Item "release\Anchor Setup $ver.exe" "anchor-desktop-$ver-windows-x64-setup.exe"
          Copy-Item "target\release\anchor-desktop.exe" "anchor-desktop-$ver-windows-x64.exe"
          Get-ChildItem release\*.exe | Select-Object Name, Length

      # 桌面端自更新契约：解析器要求随 release 提供 SHA256SUMS（含桌面 exe 条目）
      - name: 生成桌面端 SHA256SUMS
        shell: bash
        working-directory: apps/desktop-rs
        run: |
          ver=${GITHUB_REF_NAME#v}
          sha256sum "anchor-desktop-${ver}-windows-x64.exe" "anchor-desktop-${ver}-windows-x64-setup.exe" > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: anchor-desktop-windows-x64
          path: |
            apps/desktop-rs/anchor-desktop-*-windows-x64.exe
            apps/desktop-rs/anchor-desktop-*-windows-x64-setup.exe
            apps/desktop-rs/SHA256SUMS

  package-android:
    name: 打包 Android APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 确保 gradlew 可执行
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      - name: 构建 Debug APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug

      - name: 重命名产物
        run: |
          ver=${GITHUB_REF_NAME#v}
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk "anchor-mobile-${ver}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: anchor-mobile-apk
          path: anchor-mobile-*-debug.apk

  package-extensions:
    name: 打包 Chrome / VS Code 扩展
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install || (pnpm approve-builds --all && pnpm install)

      # tsconfig extends ./.wxt/tsconfig.json（WXT 生成目录，不入库）
      - name: 生成 WXT 类型目录
        run: pnpm --filter apps-chrome-ext exec wxt prepare

      - name: 构建 Chrome 扩展（可上传商店的 zip）
        working-directory: apps/chrome-ext
        run: pnpm zip

      - name: 构建 VS Code 扩展（vsix）
        working-directory: apps/vscode-ext
        run: pnpm package

      - name: 重命名产物
        run: |
          ver=${GITHUB_REF_NAME#v}
          cp apps/chrome-ext/.output/*-chrome.zip "anchor-chrome-${ver}.zip"
          cp apps/vscode-ext/*.vsix "anchor-vscode-${ver}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: anchor-extensions
          path: |
            anchor-chrome-*.zip
            anchor-vscode-*.vsix

  # 阶段 3：发布 GitHub Release
  publish:
    name: 发布 GitHub Release
    needs: [package-desktop, package-android, package-extensions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
