name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop:
    name: 构建桌面端（Windows x64）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-rs

      - name: cargo build --release
        working-directory: apps/desktop-rs
        run: cargo build --release

      - name: 打包产物
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          Copy-Item apps/desktop-rs/target/release/anchor-desktop.exe "anchor-desktop-$ver-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: anchor-desktop-windows-x64
          path: anchor-desktop-*-windows-x64.exe

  android:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 确保 gradlew 可执行
        working-directory: apps/mobile/android
        run: chmod +x gradlew

      - name: 构建 Debug APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug

      - name: 打包产物
        run: |
          ver=${GITHUB_REF_NAME#v}
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk "anchor-mobile-${ver}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: anchor-mobile-apk
          path: anchor-mobile-*-debug.apk

  release:
    name: 发布 GitHub Release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
