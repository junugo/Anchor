[package]
name = "anchor-desktop"
version = "0.1.0"
edition = "2021"
description = "Anchor 桌面端（Rust + Slint 守护进程）"
default-run = "anchor-desktop"

[dependencies]
slint = { version = "1.17", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "unstable-winit-030",
    "renderer-femtovg",
    "raw-window-handle-06",
] }
raw-window-handle = "0.6"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
time = { version = "0.3", features = ["local-offset", "std"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
log = "0.4"
ureq = { version = "2", default-features = false }
png = "0.17"
base64 = "0.22"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"

[build-dependencies]
slint-build = "1.17"
embed-resource = "2"

[profile.release]
opt-level = 2
lto = "thin"
