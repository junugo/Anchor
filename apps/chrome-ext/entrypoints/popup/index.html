<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Anchor</title>
    <style>
      :root {
        --bg: #f5f0eb;
        --surface: #ffffff;
        --border: #e0d9d0;
        --border-subtle: #ede8e2;
        --text-primary: #1a1410;
        --text-secondary: #6b6560;
        --text-disabled: #b0a89e;
        --passive: #22863a;
        --soft: #b08800;
        --hard: #c0622a;
        --curfew: #cf222e;
        --sleep: #1e3a8a;
        --away: #6e7681;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1814;
          --surface: #252018;
          --border: #3a3228;
          --border-subtle: #302820;
          --text-primary: #f0ebe4;
          --text-secondary: #9e978e;
          --text-disabled: #5a5550;
          --passive: #3fb950;
          --soft: #e3b341;
          --hard: #d4703a;
          --curfew: #ff7b72;
          --sleep: #60a5fa;
          --away: #8b949e;
        }
      }
      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        box-sizing: border-box;
        background: var(--bg);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.3;
        color: var(--text-primary);
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 0 4px;
      }
      .header h2 {
        margin: 0;
      }
      .icon-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        padding: 0;
        background: none;
        border: none;
        border-radius: 6px;
        color: var(--text-secondary);
        cursor: pointer;
      }
      .icon-btn:hover {
        color: var(--text-primary);
        background: var(--border-subtle);
      }
      .icon-btn.spinning svg {
        animation: anchor-spin 1s linear infinite;
      }
      @keyframes anchor-spin {
        to { transform: rotate(360deg); }
      }
      .sync-status {
        min-height: 14px;
        margin: 0 0 6px 2px;
        font-size: 12px;
        color: var(--text-secondary);
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 40px;
        padding: 0 12px;
        box-sizing: border-box;
      }
      .row + .row {
        border-top: 1px solid var(--border-subtle);
      }
      .label {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
      }
      .value {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-primary);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h2>Anchor</h2>
      <div style="display: flex; gap: 4px">
        <button id="sync-btn" class="icon-btn" type="button" title="从服务器同步分类" aria-label="从服务器同步分类">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        </button>
        <button id="settings-btn" class="icon-btn" type="button" title="打开服务器设置" aria-label="打开服务器设置">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>
    <div id="sync-status" class="sync-status"></div>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
