<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Anchor 设置</title>
    <style>
      :root {
        --bg: #f5f0eb;
        --surface: #ffffff;
        --border: #e0d9d0;
        --text-primary: #1a1410;
        --text-secondary: #6b6560;
        --accent: #c0622a;
        --ok: #22863a;
        --err: #cf222e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1814;
          --surface: #252018;
          --border: #3a3228;
          --text-primary: #f0ebe4;
          --text-secondary: #9e978e;
          --accent: #d4703a;
          --ok: #4ac26b;
          --err: #f85149;
        }
      }
      body {
        max-width: 420px;
        margin: 0 auto;
        padding: 24px 16px;
        background: var(--bg);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: var(--text-primary);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 17px;
        font-weight: 600;
      }
      .subtitle {
        margin: 0 0 16px;
        font-size: 12px;
        color: var(--text-secondary);
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
        margin-bottom: 12px;
      }
      label {
        display: block;
        margin: 0 0 4px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
      }
      input {
        width: 100%;
        box-sizing: border-box;
        height: 32px;
        margin: 0 0 12px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text-primary);
        font-size: 13px;
        font-family: inherit;
      }
      input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      button {
        height: 32px;
        padding: 0 14px;
        border: none;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-primary);
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #pair-status {
        font-size: 12px;
        line-height: 1.5;
      }
      #pair-status.ok { color: var(--ok); }
      #pair-status.err { color: var(--err); }
      .paired-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        margin-bottom: 12px;
        border-radius: 6px;
        background: color-mix(in srgb, var(--ok) 12%, transparent);
        color: var(--ok);
        font-size: 12px;
        font-weight: 500;
      }
      .hint {
        margin: 10px 0 0;
        font-size: 11px;
        line-height: 1.5;
        color: var(--text-secondary);
      }
      #fingerprint {
        font-family: ui-monospace, monospace;
      }
      #saved {
        font-size: 12px;
        color: var(--ok);
        visibility: hidden;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1 id="page-title">配对你的浏览器</h1>
    <p class="subtitle" id="page-subtitle">在 Anchor 服务器管理界面获取配对码，完成配对后自动连接</p>

    <!-- 已配对状态条 -->
    <div class="paired-bar" id="paired-bar" hidden>
      <span id="paired-text">已配对</span>
    </div>

    <!-- 配对表单（未配对时主显；已配对时点「重新配对」展开，覆盖现有 token） -->
    <div class="card" id="pair-card">
      <label for="pair-server-url">服务器地址</label>
      <input id="pair-server-url" type="text" placeholder="http://localhost:4000" autocomplete="off" spellcheck="false" />
      <label for="pair-code">配对码</label>
      <input id="pair-code" type="text" placeholder="如 A3F9-2K7D" autocomplete="off" autocapitalize="characters" spellcheck="false" />
      <label for="pair-device-name">设备名</label>
      <input id="pair-device-name" type="text" autocomplete="off" spellcheck="false" />
      <div class="row">
        <button id="pair-btn" type="button">配对</button>
        <span id="pair-status"></span>
      </div>
    </div>

    <!-- 已配对后的设置项 -->
    <div class="card" id="settings-card" hidden>
      <label for="server-url">服务器地址</label>
      <input id="server-url" type="text" placeholder="http://localhost:4000" autocomplete="off" spellcheck="false" />
      <label for="data-key">数据密钥</label>
      <input id="data-key" type="password" placeholder="通常由配对自动下发，无需手动填写" autocomplete="off" spellcheck="false" />
      <div class="row">
        <button id="save" type="button">保存</button>
        <span id="saved">已保存</span>
        <button id="re-pair" class="secondary" type="button" style="margin-left: auto;">重新配对</button>
      </div>
      <p class="hint">
        密钥须与服务器环境变量 <code>ANCHOR_DATA_KEY</code> 一致。当前生效密钥指纹：<span id="fingerprint">-</span>
      </p>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
